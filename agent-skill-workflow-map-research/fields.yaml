topic: "本地 Agent Skill 盘点、工作流地图与能力缺口分析市场调研"
categories:
  - category: identity
    description: "对象身份与定位"
    fields:
      - name: name
        description: "当前正式名称及历史名称"
        detail_level: 简要
      - name: category
        description: "标准、Agent 生态、直接竞品、相邻竞品或需求/风险证据"
        detail_level: 极简
      - name: maintainer
        description: "维护公司、组织或主要仓库"
        detail_level: 简要
      - name: status_as_of
        description: "截至 2026-08-03 的活跃状态与最近更新证据"
        detail_level: 简要
  - category: compatibility
    description: "扫描、格式与跨 Agent 兼容性"
    fields:
      - name: supported_agents
        description: "明确支持或可推断兼容的 Agent"
        detail_level: 详细
      - name: artifact_types
        description: "SKILL.md、plugin、command、rule、MCP 或其他能力载体"
        detail_level: 详细
      - name: local_paths_and_scopes
        description: "全局、项目、工作区、插件缓存等目录与优先级"
        detail_level: 详细
      - name: discovery_method
        description: "已知目录、配置清单、文件系统搜索、注册表或 API"
        detail_level: 详细
      - name: normalization_feasibility
        description: "归一到 Capability 模型所需适配器及主要障碍"
        detail_level: 详细
  - category: inventory_features
    description: "本地资产管理能力"
    fields:
      - name: local_inventory
        description: "是否盘点已安装 Skill，是否跨 Agent"
        detail_level: 详细
      - name: deduplication
        description: "是否识别软链接、同源副本、名称冲突或内容重复"
        detail_level: 详细
      - name: classification_and_search
        description: "分类、摘要、标签、全文或语义搜索能力"
        detail_level: 详细
      - name: lifecycle_management
        description: "安装、更新、锁定、迁移、卸载与来源追踪"
        detail_level: 详细
      - name: static_quality_checks
        description: "格式、依赖、损坏链接、风险或质量检查"
        detail_level: 详细
  - category: workflow_intelligence
    description: "从目标到流程及能力缺口的能力"
    fields:
      - name: vague_goal_decomposition
        description: "能否把模糊方向渐进拆解为阶段、决策和交付物"
        detail_level: 详细
      - name: workflow_map
        description: "是否生成可视化或结构化的依赖流程"
        detail_level: 详细
      - name: local_capability_matching
        description: "是否将工作流节点匹配到本机已有 Skill"
        detail_level: 详细
      - name: gap_analysis
        description: "是否区分完整、部分、不确定和缺失覆盖"
        detail_level: 详细
      - name: explainability
        description: "是否展示匹配证据、假设、来源和置信度"
        detail_level: 详细
      - name: planning_vs_execution
        description: "只规划、导出，还是自动执行和恢复"
        detail_level: 简要
  - category: trust_and_governance
    description: "隐私、安全与验证状态"
    fields:
      - name: local_first
        description: "索引和分析是否可完全保留在本机"
        detail_level: 详细
      - name: permissions_and_data_flow
        description: "扫描授权、上传内容、执行权限与默认行为"
        detail_level: 详细
      - name: provenance
        description: "作者、仓库、版本、许可证与变更历史"
        detail_level: 详细
      - name: validation_status
        description: "是否区分未验证、人工确认和运行验证"
        detail_level: 详细
      - name: security_model
        description: "恶意指令、依赖、脚本与供应链风险控制"
        detail_level: 详细
  - category: market_evidence
    description: "需求、采用和商业信息"
    fields:
      - name: user_problem_evidence
        description: "近期第一人称问题、时间、来源及替代做法"
        detail_level: 详细
      - name: adoption_signals
        description: "安装量、下载量、活跃贡献、仓库指标或社区规模"
        detail_level: 详细
      - name: pricing_and_license
        description: "免费、开源、订阅、企业版及许可证"
        detail_level: 简要
      - name: strengths
        description: "对目标用户已解决得较好的问题"
        detail_level: 简要
      - name: gaps_vs_skillsmap
        description: "与本地跨 Agent 工作流地图闭环相比的缺口"
        detail_level: 详细
      - name: evidence_strength
        description: "强、中、弱，并说明判断理由"
        detail_level: 简要
  - category: decision
    description: "对项目决策的影响"
    fields:
      - name: reusable_patterns
        description: "可以借鉴的交互、数据模型、治理或分发机制"
        detail_level: 简要
      - name: differentiation_risk
        description: "功能重合、被平台吸收和替代的风险"
        detail_level: 详细
      - name: recommendation
        description: "继续、调整、集成或停止，以及证据依据"
        detail_level: 详细
      - name: confidence
        description: "结论置信度与尚未验证的假设"
        detail_level: 简要
uncertain:
  - "WorkBuddy 的正式产品名称、Skill 路径与公开文档范围"
  - "Cursor 截至 2026-08-03 对 Agent Skills 标准的正式支持边界"
  - "各目录和市场的真实活跃用户数，避免用累计条目数代替需求"
  - "本地管理工具是否已经提供语义级去重或目标驱动的工作流缺口分析"
  - "公开社区抱怨是否足够独立，是否存在转载或营销内容造成的重复计数"
