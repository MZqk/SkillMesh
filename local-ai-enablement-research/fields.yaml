topic: "SkillsMap 当前启用方式与零外部 LLM API Key 的本机 AI 接入调研"
categories:
  - category: identity_and_scope
    description: "对象与范围"
    fields:
      - name: name
        description: "调研对象名称"
        detail_level: 极简
      - name: category
        description: "架构、集成或决策分类"
        detail_level: 极简
      - name: scope
        description: "该对象覆盖的问题和明确不覆盖的边界"
        detail_level: 简要
      - name: status_as_of
        description: "截至 2026-08-03 的实现或官方能力状态"
        detail_level: 简要
  - category: current_implementation
    description: "当前实现证据"
    fields:
      - name: current_entrypoints
        description: "当前 Finder、npm、CLI、HTTP 与网页启动入口"
        detail_level: 详细
      - name: current_data_flow
        description: "扫描、匹配、导出和前端持久化的数据流"
        detail_level: 详细
      - name: existing_ai_or_mcp
        description: "现有 MCP、模型、AI CLI、鉴权或子进程能力"
        detail_level: 详细
      - name: repository_evidence
        description: "关键代码文件、行号、测试或本机运行探针"
        detail_level: 详细
  - category: architecture_and_protocol
    description: "架构与协议"
    fields:
      - name: role_model
        description: "项目、AI Host、MCP Client/Server、网页与 CLI Agent 的角色"
        detail_level: 详细
      - name: protocol_options
        description: "stdio、Streamable HTTP、MCP Apps、JSON-RPC、ACP 或流式 JSON 选项"
        detail_level: 详细
      - name: ui_strategy
        description: "独立网页、MCP Apps 以及不支持 UI 的 Host 的降级方式"
        detail_level: 详细
      - name: session_and_streaming
        description: "会话恢复、事件流、审批、取消和错误恢复能力"
        detail_level: 详细
      - name: context_and_output_limits
        description: "分页、过滤、正文暴露和模型上下文控制"
        detail_level: 详细
  - category: zero_key_and_providers
    description: "零外部 API Key 与本机 Agent"
    fields:
      - name: zero_key_definition
        description: "无需项目配置 API key 的准确含义与限制"
        detail_level: 详细
      - name: provider_matrix
        description: "Codex、Claude、Gemini 与本地模型的认证、协议、流式和适用性对比"
        detail_level: 详细
      - name: local_runtime_probe
        description: "本机 CLI 路径、版本、健康状态和发现陷阱"
        detail_level: 详细
      - name: licensing_and_terms
        description: "订阅/OAuth 凭证用于个人工具、内部工具或分发产品的限制"
        detail_level: 详细
      - name: offline_option
        description: "完全离线本地模型作为可选后端的条件"
        detail_level: 简要
  - category: security_and_operations
    description: "安全与运维"
    fields:
      - name: trust_boundary_change
        description: "从只读目录工具变为 Agent 执行入口后的信任边界变化"
        detail_level: 详细
      - name: browser_localhost_security
        description: "Host/Origin/CSRF/DNS rebinding、回环监听与本地网络访问风险"
        detail_level: 详细
      - name: process_security
        description: "命令白名单、shell=false、环境变量、cwd、沙箱、超时、并发和终止"
        detail_level: 详细
      - name: privacy_and_prompt_injection
        description: "Skill 正文、登录凭证、Agent 输出与提示注入的处理"
        detail_level: 详细
      - name: observability_and_testing
        description: "健康探针、事件日志、协议测试、假 CLI 与浏览器验收"
        detail_level: 详细
  - category: decision
    description: "决策与实施"
    fields:
      - name: options_comparison
        description: "各方案的优点、缺点、复杂度、成熟度和适配度"
        detail_level: 详细
      - name: recommended_architecture
        description: "与当前仓库最匹配的目标架构及选择理由"
        detail_level: 详细
      - name: repository_change_points
        description: "建议新增或修改的文件与职责"
        detail_level: 详细
      - name: rollout_plan
        description: "最小可行阶段、启用开关、回退和后续扩展"
        detail_level: 详细
      - name: acceptance_criteria
        description: "功能、安全、隐私与兼容性验收标准"
        detail_level: 详细
      - name: recommendation
        description: "最终建议与优先级"
        detail_level: 详细
      - name: confidence
        description: "结论置信度和仍需实测的假设"
        detail_level: 简要
  - category: evidence
    description: "来源与不确定性"
    fields:
      - name: sources
        description: "官方资料和代码证据链接"
        detail_level: 详细
      - name: evidence_strength
        description: "强、中、弱及理由"
        detail_level: 简要
uncertain:
  - "各 MCP Host 对 MCP Apps 的具体版本和渲染支持会快速变化"
  - "本机 CLI 是否已完成账号登录；本研究不读取或展示账号信息"
  - "订阅/OAuth 凭证在未来条款中的产品化许可可能变化"
  - "Codex app-server 与 Gemini ACP 的跨版本事件模式需要在锁定版本后做契约测试"
  - "完全离线模型的质量、硬件占用和中文表现需单独基准测试"
