topic: "SkillsMap 当前启用方式与零外部 LLM API Key 的本机 AI 接入调研"
topic_slug: local-ai-enablement-research
current_date: 2026-08-03
time_range:
  primary: "截至 2026-08-03 的当前实现与当前官方能力"
  historical: "仅在解释协议演进、兼容性或弃用项时引用更早资料"
research_question: >-
  当前 SkillsMap 如何启动和运行；若需要 AI 能力，如何优先通过 MCP、
  其次通过现有网页调用本机 CLI AI Agent，并让项目本身不要求配置外部 LLM API key？
constraints:
  - "优先 MCP；网页调用本地 CLI Agent 为第二选择"
  - "项目不读取、保存或要求用户粘贴外部 LLM API key"
  - "保持本机优先，默认仅监听 127.0.0.1"
  - "尽量复用现有 scanner、matcher、exporter 与静态网页"
  - "区分无需 API key、无需登录、离线运行三种不同含义"
items:
  - id: current_project_and_mcp_enablement
    name: "当前项目启用链路与 MCP 优先方案"
    category: architecture
    description: >-
      审计 Finder、npm、CLI、HTTP 服务与网页现状；评估把现有只读能力暴露为
      stdio/Streamable HTTP MCP Server，并以 MCP Apps 作为可选 UI 的角色、收益和改造点。
  - id: web_local_ai_agent_bridge
    name: "网页调用本机 AI Agent 的零 Key 桥接方案"
    category: integration
    description: >-
      对比 Codex SDK/app-server/mcp-server/exec、Gemini ACP/headless、Claude headless，
      以及本地模型运行时；核对登录态复用、流式事件、会话、审批、许可与本机实际可用性。
  - id: security_compatibility_and_rollout
    name: "安全边界、兼容性与渐进落地路线"
    category: decision
    description: >-
      评估 localhost 攻击面、Origin/CSRF、子进程、目录权限、提示注入、日志和并发；
      给出最小改动文件落点、阶段顺序、验收指标、回退策略与最终建议。
execution:
  batch_size: 3
  items_per_agent: 1
  mode: parallel
  output_dir: results
  source_policy:
    repository_claims: "以当前工作区代码、测试与运行探针为准"
    protocol_claims: "优先 MCP 规范和官方 SDK 文档"
    provider_claims: "只使用 OpenAI、Anthropic、Google/Gemini 的官方文档或官方仓库"
    security_claims: "优先 MCP 规范、Node.js 官方文档和浏览器平台文档"
    freshness: "记录截至 2026-08-03 的版本或文档更新时间"
