<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>SkillMesh 工作台</title>
  <style>:root {
  color-scheme: light dark;
  --canvas: #edf4f0;
  --surface: #f8fbf9;
  --surface-raised: #ffffff;
  --ink: #10251e;
  --muted: #5d7069;
  --line: #cbdad3;
  --forest: #176b53;
  --forest-deep: #0d4e3d;
  --mint: #bfe8d6;
  --mint-soft: #e5f4ed;
  --amber: #a56516;
  --amber-soft: #fff0d4;
  --coral: #a7443d;
  --coral-soft: #fbe9e7;
  --shadow: 0 14px 38px rgb(22 66 52 / 10%);
  font-family: Inter, "SF Pro Text", "Noto Sans SC", "Microsoft YaHei", sans-serif;
  background: var(--canvas);
  color: var(--ink);
}

:root[data-theme="dark"] {
  --canvas: #0f1815;
  --surface: #15231e;
  --surface-raised: #1a2b25;
  --ink: #edf7f2;
  --muted: #a6bab1;
  --line: #334b41;
  --forest: #68c7a2;
  --forest-deep: #94ddbf;
  --mint: #285c49;
  --mint-soft: #1b392e;
  --amber: #f0bc6e;
  --amber-soft: #3d2e18;
  --coral: #ef9a92;
  --coral-soft: #442623;
  --shadow: 0 14px 38px rgb(0 0 0 / 24%);
}

* { box-sizing: border-box; }
body { margin: 0; min-width: 280px; background: var(--canvas); }
button, select, textarea, input { font: inherit; color: inherit; }
button, select, textarea, input { border: 1px solid var(--line); background: var(--surface-raised); }
button { cursor: pointer; }
button:disabled, input:disabled, select:disabled, textarea:disabled { cursor: not-allowed; opacity: .55; }
button:focus-visible, select:focus-visible, textarea:focus-visible, input:focus-visible { outline: 3px solid color-mix(in srgb, var(--forest) 48%, transparent); outline-offset: 2px; }
[hidden] { display: none !important; }

.workbench { width: min(1180px, 100%); margin: 0 auto; padding: 22px; }
.masthead { display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; padding: 24px; border: 1px solid var(--line); border-radius: 22px 22px 9px 9px; background: var(--surface); box-shadow: var(--shadow); }
.brand-block { display: flex; gap: 17px; align-items: flex-start; }
.mesh-mark { position: relative; width: 46px; height: 54px; flex: 0 0 auto; }
.mesh-mark::before, .mesh-mark::after, .mesh-mark i { content: ""; position: absolute; display: block; border-radius: 999px; }
.mesh-mark::before { inset: 8px 6px; border: 2px solid var(--forest); transform: skewY(-20deg); }
.mesh-mark::after { left: 4px; top: 8px; width: 9px; height: 9px; background: var(--forest); box-shadow: 28px 11px 0 var(--amber), 9px 34px 0 var(--forest); }
.mesh-mark i { height: 2px; background: var(--forest); transform-origin: left center; }
.mesh-mark i:nth-child(1) { width: 31px; left: 9px; top: 13px; transform: rotate(21deg); }
.mesh-mark i:nth-child(2) { width: 35px; left: 11px; top: 17px; transform: rotate(83deg); }
.mesh-mark i:nth-child(3) { width: 29px; left: 13px; top: 42px; transform: rotate(-42deg); }
.eyebrow { margin: 0 0 6px; color: var(--forest); font: 700 11px/1.2 "SFMono-Regular", Consolas, monospace; letter-spacing: .13em; text-transform: uppercase; }
h1, h2, h3, h4 { margin: 0; font-family: "Avenir Next Condensed", "Arial Narrow", "Noto Sans SC", sans-serif; letter-spacing: -.02em; }
h1 { max-width: 760px; font-size: clamp(29px, 5vw, 51px); line-height: .98; }
.lede { max-width: 760px; margin: 12px 0 0; color: var(--muted); line-height: 1.55; }
.host-block { display: flex; align-items: flex-end; flex-direction: column; gap: 9px; }
.host-badge, .pill, .count { display: inline-flex; align-items: center; min-height: 27px; padding: 4px 9px; border-radius: 999px; background: var(--mint-soft); color: var(--forest-deep); font-size: 12px; font-weight: 700; }
.host-badge::before { content: ""; width: 7px; height: 7px; margin-right: 7px; border-radius: 50%; background: currentColor; }

.control-rail { display: grid; grid-template-columns: minmax(170px, 1fr) minmax(150px, .8fr) minmax(240px, 1.5fr) auto; gap: 12px; align-items: end; margin-top: 12px; padding: 16px; border: 1px solid var(--line); border-radius: 9px 9px 18px 18px; background: var(--surface); }
label, legend { color: var(--muted); font-size: 12px; font-weight: 700; }
label { display: grid; gap: 7px; }
select, textarea, input { width: 100%; border-radius: 9px; padding: 9px 10px; }
textarea { resize: vertical; line-height: 1.5; }
.target-options { display: flex; flex-wrap: wrap; gap: 6px; min-width: 0; margin: 0; padding: 0; border: 0; }
.target-options legend { width: 100%; margin-bottom: 4px; }
.target-options label { display: flex; flex-direction: row; align-items: center; gap: 5px; padding: 6px 9px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface-raised); color: var(--ink); font-weight: 600; }
.target-options input { width: auto; margin: 0; }
.primary, .quiet, .danger { min-height: 38px; padding: 8px 13px; border-radius: 9px; font-weight: 750; }
.primary { border-color: var(--forest); background: var(--forest); color: #fff; }
:root[data-theme="dark"] .primary { color: #082119; }
.quiet { background: var(--surface-raised); }
.danger { border-color: var(--coral); background: var(--coral-soft); color: var(--coral); }
.compact { min-height: 30px; padding: 5px 9px; font-size: 12px; }
.status { min-height: 25px; padding: 8px 2px 0; color: var(--muted); font-size: 13px; }
.status.error, .form-error { color: var(--coral); }
.status.warning { color: var(--amber); }

.tabs { display: flex; gap: 3px; margin-top: 14px; overflow-x: auto; border-bottom: 1px solid var(--line); }
.tabs button { min-width: max-content; padding: 12px 16px; border: 0; border-bottom: 3px solid transparent; background: transparent; color: var(--muted); font-weight: 750; }
.tabs button[aria-selected="true"] { border-bottom-color: var(--forest); color: var(--forest-deep); }
.panel { min-height: 350px; padding: 18px 0 30px; }
.panel-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
.panel-head p { max-width: 720px; margin: 6px 0 0; color: var(--muted); line-height: 1.5; }
.stat-strip { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-bottom: 18px; }
.stat { padding: 13px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.stat strong { display: block; font: 800 24px/1 "Avenir Next Condensed", "Arial Narrow", sans-serif; }
.stat span { display: block; margin-top: 5px; color: var(--muted); font-size: 11px; }
.notice, .empty, .confirm-box { padding: 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--muted); line-height: 1.5; }
.notice.warning, .confirm-box { border-color: color-mix(in srgb, var(--amber) 45%, var(--line)); background: var(--amber-soft); color: var(--ink); }
.notice.error { border-color: color-mix(in srgb, var(--coral) 45%, var(--line)); background: var(--coral-soft); color: var(--ink); }

.stage-list, .route, .deck { display: grid; gap: 12px; }
.stage-card, .skill-card, .install-plan, .settings-card, .external-review { position: relative; padding: 17px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
.stage-card header, .skill-card header, .install-plan header, .external-review header { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
.stage-card p, .skill-card p, .install-plan p { color: var(--muted); line-height: 1.5; }
.candidate-grid, .cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; margin-top: 12px; }
.candidate { padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-raised); }
.candidate h4 { font-size: 16px; }
.candidate p { margin: 6px 0; font-size: 12px; }
.candidate-actions, .action-row { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; }
.candidate-actions button { min-height: 31px; padding: 5px 8px; border-radius: 7px; font-size: 11px; font-weight: 700; }
.capability-list, .criteria { margin: 10px 0 0; padding-left: 19px; color: var(--muted); line-height: 1.55; }

.gap-board { margin-bottom: 18px; padding: 14px; border: 1px solid color-mix(in srgb, var(--amber) 45%, var(--line)); border-radius: 13px; background: var(--amber-soft); }
.gap-board ul { margin: 8px 0 0; padding-left: 20px; }
.route { position: relative; padding-left: 27px; }
.route::before { content: ""; position: absolute; top: 7px; bottom: 7px; left: 8px; width: 2px; background: linear-gradient(var(--forest), var(--mint)); }
.route-card::before { content: attr(data-order); position: absolute; left: -28px; top: 18px; display: grid; place-items: center; width: 20px; height: 20px; border: 2px solid var(--surface-raised); border-radius: 50%; background: var(--forest); color: #fff; font: 700 9px/1 "SFMono-Regular", monospace; }
.binding { margin-top: 12px; padding: 12px; border-left: 3px solid var(--forest); border-radius: 3px 9px 9px 3px; background: var(--mint-soft); }
.binding.alternative { border-left-color: var(--amber); background: var(--amber-soft); }
.binding strong { display: block; }
.binding small { color: var(--muted); }
.route-meta { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }

.deck-section { margin-bottom: 18px; }
.deck-section > header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 9px; }
.deck-section > header p { margin: 4px 0 0; color: var(--muted); font-size: 12px; }
.skill-card footer { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 12px; }
.favorite { border: 0; background: transparent; color: var(--amber); font-size: 22px; line-height: 1; }
.composer { position: fixed; inset: 16px; z-index: 20; max-width: 760px; max-height: calc(100vh - 32px); margin: auto; padding: 22px; overflow: auto; border: 1px solid var(--line); border-radius: 18px; background: var(--surface-raised); box-shadow: 0 24px 100px rgb(0 0 0 / 34%); }
.composer::before { content: ""; position: fixed; inset: 0; z-index: -1; background: rgb(7 20 15 / 40%); backdrop-filter: blur(3px); }
.composer-head { display: flex; justify-content: space-between; gap: 15px; margin-bottom: 18px; }
.composer form { display: grid; gap: 13px; }
.form-error { min-height: 20px; margin: 0; }
.action-row span { color: var(--muted); font-size: 12px; }

.install-items { display: grid; gap: 8px; margin-top: 12px; }
.external-reviews { display: grid; gap: 10px; margin: 0 0 18px; }
.external-reviews > header p { margin: 5px 0 0; color: var(--muted); line-height: 1.5; }
.external-review > p { color: var(--muted); line-height: 1.5; }
.external-review .notice { margin-top: 12px; }
.review-document { min-height: 270px; margin-top: 10px; font: 11px/1.55 "SFMono-Regular", Consolas, monospace; white-space: pre; }
.install-item { padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-raised); }
.install-item > label { display: flex; flex-direction: row; align-items: center; color: var(--ink); }
.install-item > label input { width: auto; }
.item-options { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 9px; }
.risk-list { margin: 8px 0 0; padding-left: 18px; color: var(--amber); font-size: 12px; }
.confirm-box { margin-top: 12px; }
.settings-card { display: grid; gap: 13px; }
.settings-card textarea { min-height: 170px; font-family: "SFMono-Regular", Consolas, monospace; font-size: 12px; }
.metadata { color: var(--muted); font: 11px/1.5 "SFMono-Regular", Consolas, monospace; overflow-wrap: anywhere; }

@media (max-width: 820px) {
  .workbench { padding: 12px; }
  .masthead, .control-rail { border-radius: 14px; }
  .masthead { padding: 18px; }
  .control-rail { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .target-options { grid-column: 1 / -1; }
  .stat-strip { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

@media (max-width: 560px) {
  .masthead, .brand-block, .panel-head, .composer-head { flex-direction: column; }
  .host-block { align-items: flex-start; }
  .control-rail, .candidate-grid, .cards, .item-options { grid-template-columns: 1fr; }
  .control-rail > * { grid-column: 1; }
  .mesh-mark { display: none; }
  .composer { inset: 8px; max-height: calc(100vh - 16px); padding: 16px; }
}

@media (prefers-reduced-motion: no-preference) {
  .panel:not([hidden]) { animation: panel-in 180ms ease-out; }
  @keyframes panel-in { from { opacity: 0; transform: translateY(4px); } }
}
</style>
</head>
<body>
  <main class="workbench" aria-labelledby="app-title">
    <header class="masthead">
      <div class="brand-block">
        <div class="mesh-mark" aria-hidden="true"><i></i><i></i><i></i></div>
        <div>
          <p class="eyebrow">SKILLMESH · 原生 MCP APP</p>
          <h1 id="app-title">把 Skill 放回工作流</h1>
          <p id="context-summary" class="lede">正在扫描本机 Skill 并装配工作台…</p>
        </div>
      </div>
      <div class="host-block">
        <span id="host-badge" class="host-badge">连接中</span>
        <button id="expand-app" class="quiet compact" type="button" hidden>展开工作台</button>
      </div>
    </header>

    <section class="control-rail" aria-label="测绘上下文">
      <label>工作流<select id="workflow-select"><option>正在读取…</option></select></label>
      <label>当前阶段<select id="stage-select"><option>正在读取…</option></select></label>
      <fieldset id="target-options" class="target-options">
        <legend>测绘目标 Agent</legend>
        <span>正在识别…</span>
      </fieldset>
      <button id="refresh-app" class="quiet" type="button">重新扫描</button>
    </section>

    <div id="status" class="status" role="status" aria-live="polite"></div>

    <nav class="tabs" aria-label="SkillMesh 工作台区域">
      <button type="button" role="tab" tabindex="0" aria-selected="true" aria-controls="panel-map" id="tab-map" data-tab="map">测绘</button>
      <button type="button" role="tab" tabindex="-1" aria-selected="false" aria-controls="panel-plan" id="tab-plan" data-tab="plan">Skill 方案</button>
      <button type="button" role="tab" tabindex="-1" aria-selected="false" aria-controls="panel-quick" id="tab-quick" data-tab="quick">快速使用</button>
      <button type="button" role="tab" tabindex="-1" aria-selected="false" aria-controls="panel-install" id="tab-install" data-tab="install">安装</button>
      <button type="button" role="tab" tabindex="-1" aria-selected="false" aria-controls="panel-settings" id="tab-settings" data-tab="settings">设置</button>
    </nav>

    <section id="panel-map" class="panel" role="tabpanel" aria-labelledby="tab-map"></section>
    <section id="panel-plan" class="panel" role="tabpanel" aria-labelledby="tab-plan" hidden></section>
    <section id="panel-quick" class="panel" role="tabpanel" aria-labelledby="tab-quick" hidden></section>
    <section id="panel-install" class="panel" role="tabpanel" aria-labelledby="tab-install" hidden></section>
    <section id="panel-settings" class="panel" role="tabpanel" aria-labelledby="tab-settings" hidden></section>

    <section id="composer" class="composer" role="dialog" aria-modal="true" hidden aria-labelledby="composer-title" aria-describedby="composer-description">
      <div class="composer-head">
        <div>
          <p id="composer-source" class="eyebrow"></p>
          <h2 id="composer-title">使用 Skill</h2>
          <p id="composer-description"></p>
        </div>
        <button id="close-composer" class="quiet" type="button">返回工作台</button>
      </div>
      <form id="use-form" novalidate>
        <label>任务<textarea id="task" rows="4" required></textarea></label>
        <label>预期产物<textarea id="outputs" rows="4" required></textarea></label>
        <p id="form-error" class="form-error" role="alert"></p>
        <div class="action-row">
          <button id="send" class="primary" type="submit">发送到当前 Agent</button>
          <span id="send-note">消息被宿主接受后才记录最近使用。</span>
        </div>
      </form>
    </section>
  </main>
